syntax = "proto3";

package containarium.v1;

option go_package = "github.com/footprintai/containarium/pkg/pb/containarium/v1;containariumv1";

import "google/api/annotations.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

// SentinelSSHBanService controls the enforcing plugin, not system fail2ban.
// The sentinel mounts REST behind its admin HMAC and forwards to a local socket.
service SentinelSSHBanService {
  // Inspect one source IP, including tracked, banned, and exempt states.
  rpc GetSSHBan(GetSSHBanRequest) returns (GetSSHBanResponse) {
    option (google.api.http) = {get: "/sentinel/ssh-bans/{listener}/{ip}"};
  }
  // Page through current bans on one independently enforcing listener.
  rpc ListSSHBans(ListSSHBansRequest) returns (ListSSHBansResponse) {
    option (google.api.http) = {get: "/sentinel/ssh-bans/{listener}"};
  }
  // Atomically clear exactly one source's counter and ban; admin-only.
  rpc UnbanSSHSource(UnbanSSHSourceRequest) returns (UnbanSSHSourceResponse) {
    option (google.api.http) = {
      post: "/sentinel/ssh-bans/{listener}/unban"
      body: "*"
    };
  }
}

// SSHBanListener identifies independent plugin processes on one sentinel.
enum SSHBanListener {
  SSH_BAN_LISTENER_UNSPECIFIED = 0;
  SSH_BAN_LISTENER_MAIN = 1;
  SSH_BAN_LISTENER_ANONYMOUS = 2;
}
