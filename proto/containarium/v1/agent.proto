syntax = "proto3";

package containarium.v1;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "containarium/v1/container.proto";
import "containarium/v1/recipe.proto";
import "containarium/v1/model_gateway.proto";
import "containarium/v1/proof_pack.proto";

option go_package = "github.com/footprintai/containarium/pkg/pb/containarium/v1;containariumv1";

// =============================================================================
// Agent skills — Phase 0 (agent-as-a-box). See docs/AGENT-SKILLS-CREWS-DESIGN.md.
//
// An "agent skill" is a packaged, runnable agent: a Recipe (the box) plus an
// agent manifest (who it is, what tools it may call, who it may talk to). This
// file is the generic mechanism only — concrete skills ship outside this repo.
//
// Crews (collaborating sets of skills) and the agent-to-agent (A2A) transport
// are deferred to later phases (A2A: Phase 1; allowed_peers enforcement:
// Phase 2; Crew/CrewService: Phase 3). The `allowed_peers` field is defined
// here so manifests are forward-compatible, but it is inert until Phase 2.
// =============================================================================

// AgentCard is the discovery document a skill serves so peer agents can find
// it and learn how to delegate to it (A2A, Phase 1). It is carried in-proto so
// the wire format stays insulated from upstream A2A churn.
message AgentCard {
  // Stable handle used by peers to address this agent (e.g. "researcher").
  string id = 1;

  // Human-readable name.
  string name = 2;

  // What this agent does — surfaced to peers and to a planner.
  string description = 3;

  // Free-form capability tags a planner can match against (e.g.
  // "web-search", "code-review", "summarize").
  repeated string capabilities = 4;

  // JSON Schema describing the task input this agent accepts.
  string input_schema_json = 5;

  // JSON Schema describing the artifact this agent returns.
  string output_schema_json = 6;
}

// AgentSkill is a packaged, runnable agent: a Recipe (the box — image,
// resources, GPU) plus the agent layer (who it is, what tools it may call,
// who it may talk to). This is the unit `containarium agent run` launches.
//
// Key invariant: allowed_scopes and allowed_peers are typed, first-class
// fields — NOT a prompt string. allowed_scopes is minted into the agent's JWT
// at launch; allowed_peers compiles into eBPF network policy (Phase 2). The
// typing IS the security boundary.
message AgentSkill {
  // Stable skill identifier (e.g. "web-researcher").
  string id = 1;

  // Display name.
  string name = 2;

  // Short description.
  string description = 3;

  // The box this agent runs in. Either reference a built-in recipe by id, or
  // inline an ad-hoc recipe definition (exactly one).
  oneof box {
    // Reference an existing recipe by id (e.g. "agent-runtime").
    string recipe_id = 4;
    // Inline recipe definition for one-off skills.
    Recipe recipe = 5;
  }

  // System prompt / persona handed to the model inside the box.
  string system_prompt = 6;

  // Platform MCP scopes this agent is permitted to use (e.g.
  // "containers:read", "containers:create"). Validated against the scope
  // taxonomy in internal/auth/scopes.go; minted into the agent's JWT at
  // launch. Least-privilege: a skill gets ONLY what it declares.
  repeated string allowed_scopes = 7;

  // A2A discovery document this skill serves (Phase 1).
  AgentCard agent_card = 8;

  // IDs of the OTHER skills this skill is permitted to send A2A tasks to.
  // In Phase 2 this list compiles to an eBPF NetworkPolicy egress allowlist,
  // so an agent literally cannot open a socket to a non-allowed peer (enforced
  // in-kernel, not in prompt). A skill that is only allowed one peer cannot
  // reach any other. An empty list = talks to no peer (leaf agent). Inert
  // until Phase 2.
  repeated string allowed_peers = 9;

  // Model identifier the runtime should drive this agent with (e.g.
  // "claude-opus-4-8"). Empty = runtime default. Exported to the box
  // (CONTAINARIUM_AGENT_MODEL) only when `engine` is also set — an
  // unspecified engine keeps this field display/audit-only, exactly as it
  // was before `engine` existed, so a daemon whose default engine does not
  // match this model id does not have its skills break on upgrade.
  string model = 10;

  // Agent engine (SDK) this skill runs on. AGENT_ENGINE_UNSPECIFIED keeps
  // today's behaviour: the daemon's configured gateway primary provider
  // picks the engine in gateway mode, or the box's own default/env decides
  // in direct mode. A named engine is honoured per run — see
  // docs/architecture/agent-router.md.
  AgentEngine engine = 11;

  // Where system_prompt came from (#2488). INLINE is the catalog text as
  // written. SDLC_PIN means the catalog text with the pinned open-sdlc-skills
  // engineering standard appended under it, so a hosted skill and a box's
  // Claude Code skill share one source for their engineering principles.
  // Visible here, on `agent get`/`list` and in the hosted catalog, so a
  // deployment that never configured the pin is a visible state rather than
  // silent drift.
  PromptSource prompt_source = 12;

  // The pin the appended standard came from, e.g.
  // "FootprintAI/open-sdlc-skills@<sha12>". Empty unless prompt_source is
  // PROMPT_SOURCE_SDLC_PIN.
  string prompt_pin = 13;
}

// PromptSource says what a skill's system_prompt is composed from (#2488).
enum PromptSource {
  PROMPT_SOURCE_UNSPECIFIED = 0;
  // The catalog's own text, unchanged.
  PROMPT_SOURCE_INLINE = 1;
  // The catalog's text plus the pinned open-sdlc-skills standard section.
  PROMPT_SOURCE_SDLC_PIN = 2;
}

// AgentEngine identifies the in-box agent loop (agent-runtime SDK) a skill
// runs on. One daemon can run skills on different engines at once — the
// engine is a per-skill choice, not a daemon-wide constant (#2222).
enum AgentEngine {
  // Runtime default: the daemon's configured gateway primary provider in
  // gateway mode, or the box's own default/env in direct mode. Never
  // rejected — this is what every skill predating this field resolves to.
  AGENT_ENGINE_UNSPECIFIED = 0;
  // Claude Agent SDK (provider: anthropic).
  AGENT_ENGINE_CLAUDE = 1;
  // OpenAI Codex SDK (provider: openai).
  AGENT_ENGINE_CODEX = 2;
  // Google Gen AI SDK (provider: gemini).
  AGENT_ENGINE_GEMINI = 3;
}

// AgentEngineReadiness reports whether a run naming this engine would be
// refused — the same truth agentengine.Resolve enforces, read-only (#2223).
enum AgentEngineReadiness {
  AGENT_ENGINE_READINESS_UNSPECIFIED = 0;
  // Resolve would use this engine without refusing: a global key, or the
  // caller's own owner key, covers the provider.
  AGENT_ENGINE_READINESS_READY = 1;
  // A named run on this engine would be refused FailedPrecondition — no
  // key anywhere Resolve can see. See `reason` for why and the fix.
  AGENT_ENGINE_READINESS_NOT_READY = 2;
  // The daemon serves no model gateway at all (direct mode): the box's own
  // secrets decide, so this daemon cannot say whether the engine would
  // actually work — never reported as READY, since that would be a guess.
  AGENT_ENGINE_READINESS_UNKNOWN_DIRECT_MODE = 3;
}

// AgentCredentialSource is WHERE a READY engine's key resolves from — never
// the key's value or fingerprint.
enum AgentCredentialSource {
  AGENT_CREDENTIAL_SOURCE_UNSPECIFIED = 0;
  // The daemon's own env/global key for this provider.
  AGENT_CREDENTIAL_SOURCE_GLOBAL_KEY = 1;
  // The caller's own per-owner registered key (SetTenantProviderKey).
  AGENT_CREDENTIAL_SOURCE_OWNER_KEY = 2;
  // No model gateway is served; the box's own secrets decide.
  AGENT_CREDENTIAL_SOURCE_DIRECT_MODE = 3;
}

// CodeCredentialSource is WHERE a box's `containarium code`-style coding
// engine (Claude Code today; Codex once #2273 lands) would currently find a
// human/headless sign-in — never the credential's value, never read, logged,
// or transmitted at any layer. Mirrors #2030's `code install` verify output
// ("report which credential source Claude Code will use, never a value"),
// condensed to the one answer GetSkillBoxCredentialStatus needs (#2272).
//
// Deliberately a DIFFERENT enum from AgentCredentialSource above:
// AgentCredentialSource is where a model-GATEWAY token's upstream key comes
// from (daemon-held, never the box's concern); CodeCredentialSource is
// whether a HUMAN has already completed Anthropic's own sign-in flow on this
// box, or placed their own key, so unattended reuse of that same box needs no
// credential of containarium's own.
enum CodeCredentialSource {
  CODE_CREDENTIAL_SOURCE_UNSPECIFIED = 0;
  // The engine's own device-code/browser sign-in has already completed on
  // this box (e.g. Claude Code's own ~/.claude/.credentials.json).
  CODE_CREDENTIAL_SOURCE_INTERACTIVE = 1;
  // A user-placed provider key/token is visible to the engine's own shell
  // environment (e.g. ANTHROPIC_API_KEY in ~/.claude/settings.json, or a 3P
  // provider env var) — the headless path #2030 documents.
  CODE_CREDENTIAL_SOURCE_API_KEY = 2;
  // Neither of the above. Expected on a freshly provisioned box (#2272)
  // until a human signs in or places a key.
  CODE_CREDENTIAL_SOURCE_NONE = 3;
  // The engine's own device-code/browser sign-in exists on this box, but the
  // expiry timestamp recorded in its sign-in credentials file (e.g. the
  // `expiresAt` field of Claude Code's ~/.claude/.credentials.json) is in
  // the past (#2371). Only that timestamp is parsed — the credential value
  // is never read, logged, or transmitted. A sign-in file with no expiry
  // timestamp reports INTERACTIVE, never EXPIRED: an unknown expiry is not
  // guessed to be a past one.
  CODE_CREDENTIAL_SOURCE_EXPIRED = 4;
}

// AgentEngineStatus is one engine's readiness row, as ListAgentEngines
// reports it. One row per AgentEngine value (#2223).
message AgentEngineStatus {
  AgentEngine engine = 1;
  // The gateway provider this engine speaks (Provider in agentengine).
  // GATEWAY_PROVIDER_UNSPECIFIED only if a future AgentEngine value has no
  // provider mapping yet.
  GatewayProvider provider = 2;
  AgentEngineReadiness readiness = 3;
  // Set exactly when readiness != READY: NOT_READY names the missing key
  // and the fix command (the same text RunAgentSkill's refusal uses);
  // UNKNOWN_DIRECT_MODE names why this daemon can't say.
  string reason = 4;
  AgentCredentialSource source = 5;
  // True for the one engine AGENT_ENGINE_UNSPECIFIED resolves to on this
  // daemon right now (gatewayPrimaryProvider's pick in gateway mode; the
  // runtime's own default in direct mode).
  bool is_default = 6;
  // Catalog skills whose manifest names this engine EXPLICITLY (#2222 Q2,
  // decided 2026-10-01) — never includes an unspecified-engine skill, even
  // one that would resolve to this engine via is_default.
  repeated string skill_ids = 7;
}

message ListAgentEnginesRequest {}
message ListAgentEnginesResponse {
  // One row per AgentEngine value (AGENT_ENGINE_UNSPECIFIED excluded — it
  // names no engine of its own to report readiness for).
  repeated AgentEngineStatus engines = 1;
  // The key owner this response's READY/NOT_READY rows were resolved for.
  // Empty for an admin caller with no owner scope (the global view) or in
  // direct mode.
  string key_owner = 2;
}

// ---- AgentSkillService request/response messages ----------------------------

message ListAgentSkillsRequest {}
message ListAgentSkillsResponse {
  repeated AgentSkill skills = 1;
}

message GetAgentSkillRequest {
  string id = 1;
}
message GetAgentSkillResponse {
  AgentSkill skill = 1;
}

// ProvisionSkillBoxRequest creates or reuses a skill's deterministic box
// (agent-<skill_id>) WITHOUT running it: no token is minted, nothing is
// seeded, and the model is never called (#2272). This is the create-or-reuse
// step RunAgentSkill/RunCrew already perform as a side effect of a real run
// — surfaced on its own so a crew member's box can exist, and a human can
// `containarium connect` in and sign in to its coding agent, BEFORE any
// inference credential exists. Without this, that box is created only as a
// side effect of a run that itself needs a credential to get that far —
// chicken-and-egg.
message ProvisionSkillBoxRequest {
  string skill_id = 1;
  // Target backend/pool placement, same scheme as RunAgentSkillRequest.
  string backend_id = 2;
  string pool = 3;
}
message ProvisionSkillBoxResponse {
  Container container = 1;
  // True when this call created the box; false when an already-provisioned
  // box (running, or stopped and started back up) was reused instead.
  bool freshly_provisioned = 2;
}

// GetSkillBoxCredentialStatusRequest asks whether a skill's already-
// provisioned box has a credential its configured coding engine would use
// to sign in — a presence check only (#2272's re-scoping comment).
message GetSkillBoxCredentialStatusRequest {
  string skill_id = 1;
}
message GetSkillBoxCredentialStatusResponse {
  // The engine this status was checked for: the skill's own `engine` field,
  // resolved to AGENT_ENGINE_CLAUDE when the skill leaves it unspecified
  // (the only engine `containarium code`'s box-side probe supports today —
  // AGENT_ENGINE_CODEX/GEMINI are refused FAILED_PRECONDITION until #2273
  // adds Codex's own probe; never guessed).
  AgentEngine engine = 1;
  // WHERE that engine's credential comes from, if anywhere — names only,
  // NEVER a value. Mirrors `containarium code install`'s own verify output
  // (#2030): this call does not read, store, log, or transmit the
  // credential itself at any layer, box to daemon to caller.
  CodeCredentialSource credential_source = 2;
  // When this check ran.
  google.protobuf.Timestamp checked_at = 3;
}

// RunAgentSkillRequest launches a single skill in its box and sends it one
// task (no peers). Useful for testing a skill in isolation.
message RunAgentSkillRequest {
  string skill_id = 1;
  // Target backend/pool placement, same scheme as recipes.
  string backend_id = 2;
  string pool = 3;
  // JSON task input matching the skill's agent_card input schema.
  string input_json = 4;
  // Optional caller-supplied run id (1-128 chars of [A-Za-z0-9._-]). Empty
  // means the daemon generates a UUID. Bound into every credential minted for
  // this run (the `run_id` claim) and returned in the response, so the run's
  // credentials can be revoked and audited as one unit.
  string run_id = 5;
  // Optional git source fetched into the run's workspace before the agent
  // starts, so a skill whose prompt reads "the code in the box" has code to
  // read. Same semantics as CreateContainerRequest fields 16-18: a shallow
  // fetch of the exact ref, run inside the box (no caller->box SSH). Empty
  // git_source means no fetch — today's behavior, unchanged.
  string git_source = 6;
  // Exact ref to check out: full SHA (preferred, reproducible), branch, tag,
  // or a server ref like "refs/pull/<n>/merge". Empty = the remote's default
  // branch. Ignored when git_source is empty.
  string git_ref = 7;
  // Bearer token for a private git_source. Used daemon-side for the single
  // fetch only (an ephemeral http.extraHeader) — never written to the box's
  // .git/config, never logged. Empty = public repo.
  string git_credential = 8;
  // Name of a tracker connection (see TrackerConnection) owned by the
  // calling tenant that this run is bound to (#1922 design note, decision
  // D3: "a run is bound to exactly one connection at launch"). Validated
  // against the caller's own connections at launch time and minted into
  // the run's JWT as the `tracker_conn` claim — the tracker verb RPCs
  // reject a request naming a different connection than this claim.
  // Empty means the run is not bound to any connection (every pre-#1922
  // run, and any run that doesn't use the tracker broker).
  string tracker_connection = 9;
  // Per-invocation engine override (#2228): when set, this run's engine is
  // resolved from THIS value instead of the skill manifest's own `engine`
  // field — the same agentengine.Resolve readiness check applies either way,
  // so an override naming an engine with no usable key is refused the same
  // way an unready manifest engine is. UNSPECIFIED (the default) means "use
  // the manifest", unchanged pre-#2228 behavior.
  AgentEngine engine = 10;
  // The organization this run is attributed to for MODEL KEY RESOLUTION:
  // when set, the run's gateway token carries key_owner "org:<id>"
  // and spends that org's registered provider key, instead of the owner
  // derived from the shared skill box's cloud_org_id label or the calling
  // identity. The skill box is shared across runs, so the org has to travel
  // with the request. Honoured ONLY for a service credential carrying the
  // literal agents:run-for-org scope (a managed control plane that has already
  // authorized the end user); any other caller setting it is PermissionDenied.
  // Empty = unchanged behaviour.
  string on_behalf_of_org_id = 11;
  // Per-run model override (#3264): the model id this run is driven with, ahead
  // of the skill's own `model`. Same rules as RunCrewRequest.model_overrides: a
  // plain id (else INVALID_ARGUMENT), and carried to the box only with a named
  // engine (the skill's, or `engine`), else FAILED_PRECONDITION. The catalog
  // skill is never mutated. Empty = the skill's own model, unchanged.
  string model = 12;
}
message RunAgentSkillResponse {
  // The box the agent ran in.
  Container container = 1;
  // JSON artifact matching the skill's output schema.
  string artifact_json = 2;
  // The effective run id (the one the caller supplied, or the generated one).
  string run_id = 3;
  // The resolved commit SHA of the fetched git_source, so an artifact can
  // cite exactly what was reviewed. Empty when the request carried no
  // git_source.
  string git_commit = 4;
  // Absolute path of the fetched workspace inside the box. Empty when the
  // request carried no git_source.
  string workspace_path = 5;
  // Human-readable status from the server, e.g. how to follow a run that is
  // still in flight on a server that runs skills asynchronously. Empty when
  // the server has nothing to add; clients print it as-is when present.
  string message = 6;
}

// ---- A2A (agent-to-agent) task contract (Phase 1) ---------------------------
//
// One agent delegates a task to a peer and gets an artifact back. The shape
// mirrors the A2A (Agent2Agent) protocol's task/artifact lifecycle but is
// carried in our own proto so the wire format stays insulated from upstream
// A2A churn (see "A2A is young" in the design note). Transport + the in-box
// A2A server are wired in #569; this file defines only the contract.

// AgentTaskState tracks the lifecycle of a delegated A2A task.
enum AgentTaskState {
  AGENT_TASK_STATE_UNSPECIFIED = 0;
  AGENT_TASK_STATE_SUBMITTED = 1;
  AGENT_TASK_STATE_WORKING = 2;
  AGENT_TASK_STATE_COMPLETED = 3;
  AGENT_TASK_STATE_FAILED = 4;
}

// AgentTask is one unit of work delegated to a peer agent.
message AgentTask {
  // Task identifier (assigned by the caller; unique within a run).
  string id = 1;
  // JSON task input matching the peer's agent_card input schema.
  string input_json = 2;
  // The run this task belongs to (the crew run's id when a crew drives the
  // hop). The in-box runtime journals the task under
  // /var/log/agent-runtime/runs/<run_id>/<skill_id>.jsonl (#2095); empty
  // means the task is not part of a tracked run and is not journaled.
  string run_id = 3;
}

// AgentArtifact is the result a peer agent returns for a task.
message AgentArtifact {
  // The task this artifact answers.
  string task_id = 1;
  // JSON output matching the peer's agent_card output schema.
  string output_json = 2;
  // Terminal state of the task.
  AgentTaskState state = 3;
  // Human-readable error when state is FAILED.
  string error = 4;
}

// SendAgentTaskRequest delegates a task to a running peer agent. The peer is
// addressed by its agent_card.id (or skill id). In Phase 2 the daemon will
// reject a send to a peer not in the caller's allowed_peers; in Phase 1 the
// field set is established and the send is best-effort over A2A.
message SendAgentTaskRequest {
  // The calling skill (for attribution + the future allowed_peers check).
  string from_skill_id = 1;
  // The target peer to deliver the task to.
  string to_peer_id = 2;
  // JSON task input matching the peer's agent_card input schema.
  string input_json = 3;

  // Correlation id threaded through the audit trail for this delegation. A
  // caller (e.g. a crew, Phase 3) sets it so every hop of a run shares one id;
  // when empty the daemon generates one. Echoed back in the response.
  string trace_id = 4;

  // The run this delegation belongs to, forwarded to the peer as
  // AgentTask.run_id so the peer's in-box runtime journals the task under
  // that run (#2095). RunCrew sets it to the crew run's id; empty leaves the
  // task unjournaled on the peer.
  string run_id = 5;
}

// SendAgentTaskResponse returns the peer's artifact.
message SendAgentTaskResponse {
  AgentArtifact artifact = 1;
  // The trace id this hop was audited under (generated if the request omitted
  // one). Lets a caller chain subsequent hops under the same id.
  string trace_id = 2;
}

// TailRunLogRequest reads one byte window of a run's journal (#2096). The
// journal is the append-only JSON-lines file the in-box runtime writes per run
// per member box (/var/log/agent-runtime/runs/<run_id>/<skill_id>.jsonl).
message TailRunLogRequest {
  // The run to read: a RunAgentSkill run id or a RunCrew run id.
  string run_id = 1;
  // Which member's journal to read. Empty = the only member of a skill run,
  // or the entry skill (first member) of a crew run.
  string skill_id = 2;
  // Byte offset to start reading from; 0 = from the beginning. Pass the
  // previous response's end_offset to resume without loss or repetition.
  int64 start_offset = 3;
  // Upper bound on chunk size in bytes: <= 262144; 0 means 65536.
  int32 max_bytes = 4;
  // 0..10: when no bytes are available at start_offset, wait up to this many
  // seconds for the journal to grow before answering with an empty chunk.
  int32 follow_seconds = 5;
  // Model-gateway calls recorded for this run and member after this sequence
  // number (#2928); 0 = from the first. Pass the previous response's
  // gateway_next_seq to resume. Independent of start_offset: the calls are
  // recorded by the daemon, not written to the journal file.
  int64 gateway_after_seq = 6;
}

// TailRunLogResponse is one window of a run's journal.
message TailRunLogResponse {
  // The journal bytes in [start_offset, end_offset).
  bytes chunk = 1;
  // Pass back as start_offset on the next call.
  int64 end_offset = 2;
  // More bytes were available past end_offset than max_bytes allowed.
  bool truncated = 3;
  // The journal's last line is a "run ended" status line and end_offset is
  // at the end of the file: nothing more is expected for this task.
  bool ended = 4;
  // The run's members that have a journal file for this run.
  repeated string skill_ids = 5;
  // Model-gateway calls made for this run and member since gateway_after_seq,
  // oldest first (#2928). A failure at the gateway happens outside the box and
  // never reaches the journal, so it is reported here as typed events. A client
  // interleaves them with the journal lines by `time`. Readers that predate the
  // field ignore it.
  repeated GatewayCall gateway_calls = 6;
  // Pass back as gateway_after_seq on the next call.
  int64 gateway_next_seq = 7;
}

// GatewayCall is one model call the gateway proxied on behalf of a run (#2928).
// It carries who paid and how it ended, never the key, a key id, the token, or
// any prompt or response content.
message GatewayCall {
  // Position in the run's call log; strictly increasing per run.
  int64 seq = 1;
  // When the gateway finished the call.
  google.protobuf.Timestamp time = 2;
  // The run member (skill) whose token made the call.
  string skill_id = 3;
  // Upstream provider name as the gateway knows it ("anthropic", "openai", ...).
  string provider = 4;
  // Model the request named; empty when the request did not say.
  string model = 5;
  // Whose key the call spent. The owner type only.
  GatewayKeyOwner key_owner = 6;
  // HTTP status of the response sent to the box; 0 when no response was
  // produced (see transport_error).
  int32 status = 7;
  // Set when the call failed before any upstream response (dial, TLS,
  // timeout, ...); UNSPECIFIED otherwise.
  GatewayTransportError transport_error = 8;
  // Time from the gateway accepting the call to the upstream's response
  // headers (to the failure, when there were none).
  int64 latency_ms = 9;
}

// GatewayKeyOwner is the type of owner whose upstream key a call spent.
enum GatewayKeyOwner {
  GATEWAY_KEY_OWNER_UNSPECIFIED = 0;
  // An organization's key (key_owner "org:<id>").
  GATEWAY_KEY_OWNER_ORG = 1;
  // A member's key (key_owner "user:<name>").
  GATEWAY_KEY_OWNER_MEMBER = 2;
  // The daemon-global key: the token named no owner, or the owner had none.
  GATEWAY_KEY_OWNER_OPERATOR_FALLBACK = 3;
}

// GatewayTransportError classifies a call that produced no upstream response.
enum GatewayTransportError {
  GATEWAY_TRANSPORT_ERROR_UNSPECIFIED = 0;
  GATEWAY_TRANSPORT_ERROR_DIAL = 1;
  GATEWAY_TRANSPORT_ERROR_TLS = 2;
  GATEWAY_TRANSPORT_ERROR_TIMEOUT = 3;
  // The caller went away before the upstream answered.
  GATEWAY_TRANSPORT_ERROR_CANCELED = 4;
  // The gateway held no key for the provider, so nothing was sent.
  GATEWAY_TRANSPORT_ERROR_NO_KEY = 5;
  GATEWAY_TRANSPORT_ERROR_OTHER = 6;
}

// AgentSkillService manages and runs individual packaged agents.
service AgentSkillService {
  // ListAgentSkills returns all available skills (built-in + registered).
  rpc ListAgentSkills(ListAgentSkillsRequest) returns (ListAgentSkillsResponse) {
    option (google.api.http) = {
      get: "/v1/agent-skills"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "List agent skills";
      description: "Returns all packaged agent skills that can be run individually or composed into a crew.";
      tags: "Agents";
    };
  }

  // ListAgentEngines reports, for each AgentEngine, whether a run naming it
  // would be refused right now — the same check RunAgentSkill's refusal
  // enforces, read-only (#2223). No live model call, no bundle inspection:
  // computed from state the daemon already holds (the global provider-key
  // set and the per-owner key store).
  rpc ListAgentEngines(ListAgentEnginesRequest) returns (ListAgentEnginesResponse) {
    option (google.api.http) = {
      get: "/v1/agent-engines"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "List agent engines and their readiness";
      description: "Returns one row per agent engine: whether a skill naming it would be refused right now, why, and which catalog skills name it explicitly.";
      tags: "Agents";
    };
  }

  // GetAgentSkill returns a single skill definition by id.
  rpc GetAgentSkill(GetAgentSkillRequest) returns (GetAgentSkillResponse) {
    option (google.api.http) = {
      get: "/v1/agent-skills/{id}"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Get agent skill";
      description: "Returns one skill's definition, including its agent card, allowed scopes, and allowed peers.";
      tags: "Agents";
    };
  }

  // ProvisionSkillBox creates or reuses a skill's deterministic box
  // (agent-<skill_id>) without running it: no token minted, nothing seeded,
  // the model never called (#2272). Lets a crew member's box exist, and a
  // human sign in to its coding agent, before any inference credential does
  // — RunAgentSkill/RunCrew are otherwise the only path that creates this
  // box, and both require a credential just to get that far.
  rpc ProvisionSkillBox(ProvisionSkillBoxRequest) returns (ProvisionSkillBoxResponse) {
    option (google.api.http) = {
      post: "/v1/agent-skills/{skill_id}/provision-box"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Provision a skill's box ahead of any run";
      description: "Creates or reuses the skill's deterministic box with no token minted, nothing seeded, and no model call — so a human can sign in to its coding agent before any inference credential exists.";
      tags: "Agents";
    };
  }

  // GetSkillBoxCredentialStatus reports whether a skill's already-
  // provisioned box has a credential its configured coding engine would use
  // — the source name only (e.g. "interactive" / "api-key" / "none"), never
  // a value, mirroring `containarium code install`'s own verify posture
  // (#2030, #2272).
  rpc GetSkillBoxCredentialStatus(GetSkillBoxCredentialStatusRequest) returns (GetSkillBoxCredentialStatusResponse) {
    option (google.api.http) = {
      get: "/v1/agent-skills/{skill_id}/credential-status"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Check a skill box's coding-agent credential source";
      description: "Reports the NAME of the credential source (interactive sign-in, a user-placed key, or none) the skill's box would use for its configured engine — never the credential's value, never read/logged/transmitted.";
      tags: "Agents";
    };
  }

