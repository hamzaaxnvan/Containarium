{{- if .Values.gateway.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "containarium-k8s.fullname" . }}-sshpiper
  namespace: {{ .Values.gateway.namespace }}
  labels:
    {{- include "containarium-k8s.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: 1
  selector:
    matchLabels:
      # Literal "sshpiper", NOT the chart-name-prefixed variant other
      # resources use: the daemon's default-deny NetworkPolicy hardcodes
      # this exact label to admit gateway->box traffic (pkg/core/box/k8s/
      # objects.go, sshpiperNameLabel) and the standalone deploy/k8s/
      # sshpiper/*.yaml manifests use the same convention. Changing it here
      # silently breaks that ingress rule on every NetworkPolicy-enforcing
      # CNI (#1492).
      app.kubernetes.io/name: sshpiper
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sshpiper
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
