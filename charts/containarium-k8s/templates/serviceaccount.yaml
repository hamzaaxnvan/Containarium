apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "containarium-k8s.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "containarium-k8s.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: true
---
